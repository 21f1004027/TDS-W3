name: Daily Auto Commit

on:
  schedule:
    - cron: "5 9 * * *"   # Runs daily at 09:05 UTC (specific time)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Create commit - 21f1004027@ds.study.iitm.ac.in
        run: |
          echo "Update at $(date +%s)" >> daily-log.txt
          git config user.name "DevSync Bot"
          git config user.email "21f1004027@ds.study.iitm.ac.in"
          git add daily-log.txt
          git commit -m "Automated daily update"
          git push
